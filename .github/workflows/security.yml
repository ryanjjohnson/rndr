name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 6 * * 1' # Mondays, so newly published advisories get noticed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    name: Known vulnerabilities (govulncheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  hostile-input:
    name: Hostile-input tests and fuzzing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Attack regression tests
        run: go test -race ./...
      - name: Same tests on a 32-bit build
        run: GOARCH=386 go test ./...
      # 30 seconds a target on every push; 5 minutes a target on the weekly run
      - name: Fuzz every input route (files, stdin, arguments, keys, view numbers)
        env:
          FUZZTIME: ${{ github.event_name == 'schedule' && '5m' || '30s' }}
        run: |
          for target in FuzzSTL FuzzSTLBinary FuzzOBJ FuzzModelXML Fuzz3MFZip FuzzSniff FuzzStdin FuzzArgs FuzzKeys FuzzView; do
            echo "::group::$target ($FUZZTIME)"
            go test -run '^$' -fuzz "^$target\$" -fuzztime "$FUZZTIME" .
            echo "::endgroup::"
          done
      - name: Keep any failing input
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-failures
          path: testdata/fuzz/

  codeql:
    name: Static analysis (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: github/codeql-action/init@v4
        with:
          languages: go
          build-mode: autobuild
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:go
