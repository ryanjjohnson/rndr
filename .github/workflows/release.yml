name: release

# Every push to main that touches the program publishes a new release: the patch
# version is bumped from the latest tag. Pushing a v* tag yourself releases exactly
# that version (use it for minor/major bumps).
on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - '**.go'
      - go.mod
      - build.sh
      - testdata/**
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write     # create the tag and release
  id-token: write     # prove to Sigstore that this workflow run is the signer
  attestations: write # store the signed provenance with the repository

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Vet and test
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race ./...

      - name: Pick version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag=$GITHUB_REF_NAME
          else
            tag=$(git tag --points-at HEAD --list 'v[0-9]*' | head -n1)
          fi
          if [ -z "$tag" ]; then
            last=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
            last=${last:-v0.0.0}
            IFS=. read -r major minor patch <<< "${last#v}"
            tag="v$major.$minor.$((patch + 1))"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag"

      - name: Build every platform
        run: |
          VERSION=${{ steps.version.outputs.tag }} sh build.sh release
          cd dist && sha256sum rndr-* > SHA256SUMS.txt

      - name: Smoke test the Linux binary
        run: |
          ./dist/rndr-linux-amd64 --version
          ./dist/rndr-linux-amd64 testdata/bracket.stl 25 -30 0 1 -s 60x20 | diff - testdata/bracket.expected.txt

      # Signs a statement that these exact files were built by this workflow from
      # this commit. Anyone can check a download with: gh attestation verify
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/rndr-*

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "$TAG" --generate-notes
          fi

  # Points the Homebrew tap at the new release. This job, and only this job, is
  # given a deploy key that can write to ryanjjohnson/homebrew-tap and nothing else.
  # The tap's own update.sh does the work, and refuses any binary whose build
  # provenance does not verify.
  tap:
    needs: release
    if: github.repository == 'ryanjjohnson/rndr'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ryanjjohnson/homebrew-tap
          ssh-key: ${{ secrets.TAP_DEPLOY_KEY }}

      - name: Update the formula
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          ./update.sh "$TAG"
          if git diff --quiet; then
            echo "The tap is already at $TAG"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "rndr ${TAG#v}"
          git push
